dependencies:
  idf: '>=5.3'
  esp_video:
    override_path: ../../../
  example_video_common:
    override_path: ../../common_components/example_video_common
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
  espressif/mdns: ^1.0.3
  esp_wifi_remote:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espressif/cjson:
    version: ^1.7.15
    rules:
    - if: idf_version >= 6.0
  espressif/esp-dl: '^3.2.4'
  espressif/esp_video: '>=1.0.0'
  espressif/esp-nn: '*'
  espressif/hand_detect: '^0.1.0'
  espressif/hand_gesture_recognition: '^0.1.0'
  espressif/human_face_detect: '^0.3.0'
  espressif/human_face_recognition: '^0.3.0'
